<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好运地图 · 本地内容审核工具</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:35px auto;padding:0 20px;background:#f4f5f0;color:#334438}textarea,input,select,button{font:inherit;box-sizing:border-box;padding:10px;border:1px solid #bbc9b8;border-radius:8px;background:white}input,textarea,select{width:100%;margin:6px 0 14px}button{cursor:pointer;background:#567862;color:white}section{background:white;padding:22px;border-radius:16px;margin:18px 0}label{font-size:14px}p{line-height:1.7}small{color:#66766a}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;line-height:1.8}h1{font-size:clamp(24px,5vw,32px);line-height:1.5}h2{font-size:20px;margin:0 0 18px}section{padding:24px;margin:22px 0;border:1px solid #dce4da}label{line-height:1.7}input,textarea,select{min-width:0;max-width:100%;margin:8px 0 18px}button{min-height:44px;max-width:100%;white-space:normal}p,small,label{overflow-wrap:anywhere}small{color:#526457}input[type=checkbox]{min-height:18px;vertical-align:middle}*:focus-visible{outline:3px solid #42664d;outline-offset:3px}@media(max-width:400px){body{margin:24px auto;padding:0 14px}section{padding:18px}}
</style></head><body><h1>内容审核 · 本地工具</h1><p><strong>仅供本地编辑。</strong>不是安全登录后台，请勿部署到公开网站。编辑后导出 JSON，人工替换 data/reviewed-content.json 并重新部署。</p><section><label>导入已有 reviewed-content.json（可选）<input id="file" type="file" accept="application/json,.json"></label><p id="counts">公告 0 条 · 帖子 0 条</p></section><section><h2>新增审核公告</h2><label>地点 ID <select id="place"></select></label><label>标题<input id="ntitle" placeholder="官方公告标题"></label><label>内容<textarea id="ncontent" rows="3"></textarea></label><label>状态<select id="status"><option value="adjusted">临时调整</option><option value="closed">暂停开放</option><option value="normal">正常开放（需官方确认）</option></select></label><label>官方 HTTPS 来源<input id="nurl" type="url" placeholder="https://..."></label><label>公告发布日期<input id="published" type="date"></label><label>人工核验日期<input id="verified" type="date"></label><label><input id="napproved" type="checkbox" style="width:auto">我已核对原始来源，批准发布</label><p><button id="addNotice">加入公告列表</button></p></section><section><h2>新增精选帖子</h2><label>标题<input id="ptitle"></label><label>平台<input id="platform" placeholder="小红书 / 其他"></label><label>原文 HTTPS 链接<input id="purl" type="url" placeholder="https://..."></label><label>发布日期<input id="pdate" type="date"></label><label><input id="papproved" type="checkbox" style="width:auto">我已确认内容可引用，批准发布</label><p><button id="addPost">加入帖子列表</button></p><small>精选页仅展示近七天且审核通过的帖子。</small></section><section><h2>待导出内容</h2><pre id="preview" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><button id="download">导出 reviewed-content.json</button><p id="message" role="status"></p></section><script src="js/data.js"></script><script src="js/admin-local.js"></script></body></html>
