<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>好运地图 · Better Things</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;700&family=Noto+Sans+SC:wght@300;400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══ Hero: integrated from demo-intro.html ═══ -->
  <section class="hero" id="hero">
    <div class="hero-bg"></div>
    <div class="hero-vignette"></div>
    <div class="hero-fade"></div>
    <div class="hero-content">
      <p class="tap-hint">轻触画面，唤醒好运</p>
    </div>
  </section>

  <!-- ═══ Main Content ═══ -->
  <div class="page-wrapper">
    <div class="container">

      <!-- 选城市 -->
      <section class="section reveal" id="citySection">
        <h2 class="section-title">选一座城</h2>
        <div class="chip-row" id="cityChips"></div>
      </section>

      <!-- 实时出行天气：保留原有 Hero 与页面样式 -->
      <section class="section reveal" id="weatherSection">
        <h2 class="section-title">城市出行天气</h2>
        <div class="card" id="weatherCard" aria-live="polite">
          <p id="weatherTitle">请选择城市查看天气</p>
          <p id="weatherDetails" class="almanac-row">选择上海、北京或杭州后自动更新</p>
          <p id="weatherUpdated" class="text-sage" style="font-size:.75rem;margin-top:8px;">数据来源：Open-Meteo · 仅供出行参考</p>
        </div>
      </section>

      <!-- 选愿望 -->
      <section class="section reveal" id="wishSection">
        <h2 class="section-title">许一个愿</h2>
        <div class="chip-row" id="wishChips"></div>
      </section>

      <!-- 推荐地点 -->
      <section class="section reveal" id="recommendSection" style="display:none;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <h2 class="section-title" style="margin-bottom:0;">为你推荐</h2>
          <a href="discover.html" class="text-sage" style="font-size:0.82rem;">查看更多 →</a>
        </div>
        <div id="recommendList" class="mt-16"></div>
      </section>

      <!-- 今日黄历占位 -->
      <section class="section reveal">
        <h2 class="section-title">今日黄历</h2>
        <div class="card almanac-card">
          <p class="almanac-date" id="almanacDate"></p>
          <p class="almanac-row" id="almanacYi"></p>
          <p class="almanac-row" id="almanacJi"></p>
          <p class="almanac-row" id="lunarReminder" style="display:none;"></p>
          <p class="mock-badge mt-8" id="almanacSource">农历由浏览器历法计算 · 宜忌尚未接入</p>
        </div>
      </section>

      <!-- 最新出行提醒 -->
      <section class="section reveal">
        <h2 class="section-title">出行提醒</h2>
        <div id="travelTips"></div>
      </section>

      <!-- Footer -->
      <footer style="text-align:center;padding:24px 0 16px;color:var(--ink-muted);font-size:0.72rem;">
        <p>好运地图 · Better Things</p>
        <p style="margin-top:4px;">所有地点信息均为模拟数据，仅供参考</p>
      </footer>

    </div>
  </div>

  <!-- ═══ Tab Bar ═══ -->
  <nav class="tab-bar">
    <a href="index.html" class="tab-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
      <span>首页</span>
    </a>
    <a href="discover.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <span>发现</span>
    </a>
    <a href="weekly.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
      <span>精选</span>
    </a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/live-data.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
