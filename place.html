<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>地点详情 · 好运地图</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@300;400;700&family=Noto+Sans+SC:wght@300;400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Top Nav -->
  <header class="top-nav">
    <button class="top-nav-back" onclick="history.back()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 19l-7-7 7-7"/></svg>
      返回
    </button>
    <span class="top-nav-title" id="navTitle">详情</span>
  </header>

  <!-- Detail Hero -->
  <div class="detail-hero" id="detailHero">
    <h1 class="detail-hero-name" id="placeName">加载中…</h1>
    <p class="detail-hero-subtitle" id="placeSubtitle"></p>
    <div class="detail-hero-tags" id="placeTags"></div>
  </div>

  <!-- Detail Content -->
  <div class="page-wrapper">
    <div class="container">

      <!-- 简介 -->
      <section class="detail-section" id="descSection">
        <div class="detail-label">简介</div>
        <p class="detail-text" id="placeDesc"></p>
        <button type="button" class="map-btn" id="favoriteBtn" aria-pressed="false">☆ 收藏地点</button>
      </section>

      <!-- 开放资讯 -->
      <section class="detail-section" id="openSection">
        <div id="bookingInfo"></div>
        <div id="noticeList"></div>
      </section>

      <!-- 地图导航 -->
      <section class="detail-section" id="mapSection">
        <div class="detail-label">地址与导航</div>
        <p class="detail-text" id="placeAddress"></p>
        <button class="map-btn" id="mapBtn" onclick="openMap()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          在地图中查看
        </button>
      </section>

      <!-- 习俗建议 -->
      <section class="detail-section" id="customsSection">
        <div class="detail-label">习俗与建议</div>
        <ul class="detail-list" id="placeCustoms"></ul>
      </section>

      <!-- 交通 -->
      <section class="detail-section" id="transportSection">
        <div class="detail-label">交通指引</div>
        <p class="detail-text" id="placeTransport"></p>
      </section>

      <!-- 数据来源 -->
      <div class="detail-source">
        <p>来源：<span id="placeSource"></span></p>
        <p>核验时间：<span id="placeVerified"></span></p>
        <p class="mock-badge mt-8">信息状态以各地点核验标注为准；预约库存与临时安排请以来源平台实时页面为准。</p>
      </div>

    </div>
  </div>

  <!-- Tab Bar -->
  <nav class="tab-bar">
    <a href="index.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
      <span>首页</span>
    </a>
    <a href="discover.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <span>发现</span>
    </a>
    <a href="weekly.html" class="tab-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
      <span>精选</span>
    </a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/booking.js"></script>
  <script src="js/notices.js"></script>
  <script src="js/reviewed-data.js"></script>
  <script src="js/reviewed-bootstrap.js"></script>
</body>
</html>
